<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#080c16" />
    <meta
      name="description"
      content="NexQ Web — 浏览器端实时语音翻译 + DeepSeek 客户端。DeepSeek Flash、1M 上下文、双语字幕。API Key 只存在你的浏览器里。"
    />
    <title>NexQ Web — DeepSeek Client</title>
    <style>
      html,
      body {
        margin: 0;
        background: hsl(222 47% 6%);
        color: hsl(210 20% 96%);
        /* Mobile browsers resize the viewport as the URL bar / keyboard moves. */
        height: 100%;
        overscroll-behavior: none;
      }
      /* Avoid iOS zooming the page when an input receives focus. */
      input,
      textarea,
      select {
        font-size: 16px;
      }
      #nexq-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0.28em;
        font-size: 12px;
        text-transform: uppercase;
        color: hsl(215 14% 64%);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="nexq-splash">NexQ</div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
